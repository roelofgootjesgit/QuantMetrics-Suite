# EXP-V4-EXIT-FIX-2026 — Trend-only, research full window
#
# Controle: zelfde entry-set als V4 (expansion skip) maar zonder vroege stop door
# equity kill switch, zodat signalen over het hele prijsvenster in de lus blijven.
#
# Let op: de SQE *backtest-simulator* gebruikt altijd vaste tp_r/sl_r (geen live trail).
# "Fixed 2R" is hier expliciet in regime_profiles.trend; productie-trail is buiten scope.
# Zie: quantbuild/src/quantbuild/backtest/engine.py::_simulate_trade

extends: V4_trend_only.yaml

regime_profiles:
  trend:
    tp_r: 2.0
    sl_r: 1.0
    max_trades_per_session: 3
    position_size_mult: 1.0
    allowed_sessions:
      - London
      - Overlap
      - New York

risk:
  # Effectief uitschakelen kill (engine: peak-cum >= threshold). Gebruik 999 i.p.v. 0
  # (0 zou iedere dip onder piek direct triggeren).
  equity_kill_switch_pct: 999.0

artifacts:
  enabled: true
  experiment_id: EXP-V4-EXIT-FIX-2026
  role: single
  bundle_analytics: true
