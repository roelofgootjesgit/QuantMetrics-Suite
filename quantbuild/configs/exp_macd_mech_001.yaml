# EXP-MACD-MECH-001 — MACD cross standalone (EURUSD M15, time exit T+8)
experiment_id: EXP-MACD-MECH-001

symbol: EURUSD
timeframes:
  - 15m

data:
  base_path: data/market_cache

backtest:
  engine: macd_only
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  session_mode: extended

strategy:
  module: macd_only
  macd:
    fast: 12
    slow: 26
    signal: 9
  signal_independence:
    min_bars_gap: 4
    min_atr_distance: 1.5

exit:
  mode: time_exit
  time_exit_bars: 8

risk:
  sl_mode: atr
  sl_atr_mult: 2.0
  risk_per_trade_pct: 0.25
  max_concurrent: 1
  max_daily_loss_r: 2.0

guards:
  spread:
    enabled: true
    max_spread_pips: 1.5

broker:
  account_id: backtest
  mock_spread: 0.00010

quantlog:
  enabled: true
  environment: backtest
  consolidated_run_file: true

artifacts:
  enabled: true
