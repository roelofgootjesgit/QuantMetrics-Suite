name: CI

on:
  push:
  pull_request:

jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests -q

      - name: Run issue #104 live-gate negative + mutation suite
        run: pytest tests/test_live_execution_gate_n.py tests/test_live_execution_gate_w.py tests/test_live_execution_gate_mutation.py -q

      - name: Run issue #104 PR-B entrypoint + mutation suite
        run: pytest tests/test_live_execution_gate_e.py tests/test_live_execution_gate_e_mutation.py -q

      - name: Run deterministic demo
        run: python run_demo.py

      # Issue #106 — offline module suites (P1–P3). QuantResearch deferred (V3).
      - name: Run quantanalytics tests (offline socket guard)
        run: pytest quantanalytics/tests -q --disable-socket --allow-unix-socket

      - name: Run quantlog tests (offline socket guard)
        working-directory: quantlog
        run: pytest tests -q --disable-socket --allow-unix-socket

      - name: Run quantbuild tests (offline socket guard)
        run: pytest quantbuild/tests -q --disable-socket --allow-unix-socket
