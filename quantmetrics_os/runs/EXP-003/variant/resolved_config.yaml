system_mode: PRODUCTION
symbol: GBPUSD
timeframes:
- 1h
data:
  base_path: data/market_cache
  source: auto
  cache_ttl_hours: 24
backtest:
  default_period_days: 60
  tp_r: 2.0
  sl_r: 1.0
  engine: london_ny_overlap_breakout
  start_date: '2021-01-01'
  end_date: '2025-12-31'
risk:
  max_position_pct: 0.02
  max_daily_loss_r: 3.0
broker:
  provider: ctrader
  environment: demo
  account_id: ''
  access_token: <redacted>
  instrument: XAUUSD
  mock_mode: true
  mock_spread: 0.4
  mock_price: 2500.0
  initial_balance: 10000
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file_path: logs/quantbuild.log
  timestamp_suffix: true
quantlog:
  enabled: true
  inference_requires_quantlog: false
  auto_analytics: true
  base_path: data/quantlog_events
  environment: dry_run
  consolidated_run_file: true
monitoring:
  telegram:
    enabled: false
    bot_token: <redacted>
    chat_id: ''
    alerts:
      trade_entry: true
      trade_exit: true
      daily_summary: true
      status_report: true
      error_alerts: true
      news_event: true
      counter_news: true
      suite_lifecycle: true
    report:
      interval_seconds: 3600
      on_startup: true
      on_shutdown: true
news:
  enabled: false
  sources:
    rss:
      enabled: false
      feeds: []
    finnhub:
      enabled: false
      category: general
      tier: 2
    newsapi:
      enabled: false
      categories:
      - business
      language: en
strategy:
  name: london_ny_overlap_breakout
session_open_utc: '13:30'
tp_multiplier: 1.5
mock_spread: 0.4
major_news_filter: true
experiment_id: EXP-003
artifacts:
  enabled: true
  experiment_id: EXP-003
  role: variant
ai: {}
